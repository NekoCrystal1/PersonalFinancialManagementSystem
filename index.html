<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人记账本</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 新增Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> 我的个人记账本</h1>
            <p class="subtitle">简单记录，清晰生活</p>
        </header>

        <main>
            <!-- 1. 顶部统计卡片区域 -->
            <div class="summary-cards">
                <div class="card income-card">
                    <div class="card-icon">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div class="card-content">
                        <h3>总收入</h3>
                        <p class="amount" id="total-income">¥0.00</p>
                    </div>
                </div>
                
                <div class="card expense-card">
                    <div class="card-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="card-content">
                        <h3>总支出</h3>
                        <p class="amount" id="total-expense">¥0.00</p>
                    </div>
                </div>
                
                <div class="card balance-card">
                    <div class="card-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <div class="card-content">
                        <h3>结余</h3>
                        <p class="amount" id="total-balance">¥0.00</p>
                    </div>
                </div>
            </div>

            <!-- 2. 添加记录区域 -->
            <div class="add-record-section">
                <h2><i class="fas fa-plus-circle"></i> 添加新记录</h2>
                <form id="add-record-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date"><i class="fas fa-calendar"></i> 日期</label>
                            <input type="date" id="date" name="date" required value="<?php echo date('Y-m-d'); ?>">
                        </div>
                        
                        <div class="form-group">
                            <label for="type"><i class="fas fa-exchange-alt"></i> 类型</label>
                            <select id="type" name="type" required>
                                <option value="">请选择类型</option>
                                <option value="income">收入</option>
                                <option value="expense">支出</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category"><i class="fas fa-tag"></i> 分类</label>
                            <select id="category" name="category" required>
                                <option value="">请先选择类型</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="amount"><i class="fas fa-yen-sign"></i> 金额</label>
                            <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="description"><i class="fas fa-comment"></i> 描述</label>
                        <input type="text" id="description" name="description" placeholder="请输入描述（可选）">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> 保存记录
                    </button>
                </form>
            </div>

            <!-- 图表容器 -->
            <div class="charts-section">
                <h2><i class="fas fa-chart-pie"></i> 收支统计</h2>
                
                <div class="charts-container">
                    <div class="chart-wrapper">
                        <div class="chart-header">
                            <h3><i class="fas fa-chart-pie"></i> 收支比例</h3>
                            <div class="chart-legend" id="pie-chart-legend"></div>
                        </div>
                        <canvas id="pie-chart"></canvas>
                    </div>
                    
                    <div class="chart-wrapper">
                        <div class="chart-header">
                            <h3><i class="fas fa-chart-bar"></i> 分类支出</h3>
                            <select id="chart-type-select">
                                <option value="month">本月</option>
                                <option value="year">本年</option>
                            </select>
                        </div>
                        <canvas id="bar-chart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 添加导出功能区域 -->
            <div class="export-section">
                <h2><i class="fas fa-file-export"></i> 数据导出</h2>
                
                <div class="export-buttons">
                    <button class="btn-export btn-export-csv" onclick="exportToCSV()">
                        <i class="fas fa-file-csv"></i>
                        <div>
                            <div>导出为CSV</div>
                            <small>Excel可打开</small>
                        </div>
                    </button>
                    
                    <button class="btn-export btn-export-pdf" onclick="exportToPDF()">
                        <i class="fas fa-file-pdf"></i>
                        <div>
                            <div>导出为PDF</div>
                            <small>打印友好</small>
                        </div>
                    </button>
                    
                    <button class="btn-export btn-export-print" onclick="printReport()">
                        <i class="fas fa-print"></i>
                        <div>
                            <div>打印报表</div>
                            <small>直接打印</small>
                        </div>
                    </button>
                </div>
                
                <div class="export-options" style="margin-top: 20px;">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="export-current-month" checked>
                        仅导出本月数据
                    </label>
                    <small style="color: #7f8c8d; display: block; margin-top: 5px;">取消勾选将导出所有数据</small>
                </div>
            </div>

            <!-- 3. 记录列表区域 -->
            <div class="records-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> 记录列表</h2>
                    <div class="filter-controls">
                        <select id="filter-type">
                            <option value="all">全部类型</option>
                            <option value="income">仅收入</option>
                            <option value="expense">仅支出</option>
                        </select>
                        <input type="month" id="filter-month" value="<?php echo date('Y-m'); ?>">
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="records-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>类型</th>
                                <th>分类</th>
                                <th>金额</th>
                                <th>描述</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="records-body">
                            <!-- 记录将通过JavaScript动态添加 -->
                            <tr id="loading-row">
                                <td colspan="6" class="loading-cell">
                                    <i class="fas fa-spinner fa-spin"></i> 正在加载数据...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="no-records" id="no-records" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>暂无记录，添加第一条记录吧！</p>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2024 个人财务管理工具 | 开发学习项目</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
